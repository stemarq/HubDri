<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador de Preço de Corrida</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#64748b;--ac:#2563eb;--bd:#e2e8f0;--ok:#16a34a}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e6e9ee;--mu:#94a3b8;--ac:#60a5fa;--bd:#2a3340;--ok:#4ade80}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
  main{max-width:960px;margin:0 auto;padding:16px;display:grid;gap:16px}
  h1{font-size:20px;margin:8px 0 0}h2{font-size:16px;margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
  input,button{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
  label.chk{display:flex;align-items:center;gap:8px;color:var(--tx)}label.chk input{width:auto}
  button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
  .preco{font-size:40px;font-weight:700}.faixa{color:var(--mu)}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.mu{color:var(--mu);font-size:13px}.err{color:#dc2626}
</style>
</head>
<body>
<main>
  <h1>Simulador de Preço de Corrida</h1>
  <p class="mu">Estimativa heurística (não é o preço oficial de nenhum app). Calibre com cotações reais para reduzir o erro.</p>

  <section class="card">
    <h2>1. Simular</h2>
    <div class="grid">
      <label>Distância (km)<input id="km" type="number" step="0.1" value="10"></label>
      <label>Duração (min, sem trânsito)<input id="min" type="number" step="1" value="22"></label>
      <label>Data e hora<input id="dh" type="datetime-local"></label>
      <label>Extras (pedágio/taxa, R$)<input id="ext" type="number" step="0.5" value="0"></label>
    </div>
    <div class="row">
      <label class="chk"><input id="chuva" type="checkbox"> Chuva</label>
      <label class="chk"><input id="evento" type="checkbox"> Evento/aglomeração</label>
      <button id="calc">Calcular</button>
    </div>
    <div id="res" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <h2>2. Cotações reais (para medir e calibrar)</h2>
    <div class="mu">Usa os campos acima + o preço que o app mostrou.</div>
    <div class="row">
      <label>Preço real (R$)<input id="preco" type="number" step="0.01"></label>
      <button id="add">Registrar cotação</button>
      <button id="cal" class="sec">Calibrar parâmetros</button>
      <button id="clr" class="sec">Limpar tudo</button>
    </div>
    <div id="msg" class="mu" style="margin-top:8px"></div>
    <div style="overflow:auto"><table id="tab"></table></div>
  </section>

  <section class="card">
    <h2>3. Parâmetros</h2>
    <div class="grid" id="params"></div>
    <div class="row"><button id="rst" class="sec">Restaurar padrão</button></div>
  </section>
</main>
<script src="heuristica.js"></script>
<script>
const H = window.HubDriHeuristica;
const $ = (id) => document.getElementById(id);
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let params = LS.get('hd_params', {...H.PARAMS_PADRAO});
let obs = LS.get('hd_obs', []);
const nomes = { base:'Base (R$)', porKm:'R$/km', porMin:'R$/min', minima:'Tarifa mínima', congestionamentoPico:'Fator trânsito pico', surgePico:'Surge pico', surgeChuva:'Surge chuva', surgeNoite:'Surge noite', surgeEvento:'Surge evento', surgeMax:'Teto do surge', extras:'Extras padrão' };

const agora = new Date(); agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
$('dh').value = agora.toISOString().slice(0, 16);

const brl = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
const entrada = () => ({ km: +$('km').value, min: +$('min').value, dataHora: $('dh').value, chuva: $('chuva').checked, evento: $('evento').checked, extras: +$('ext').value || 0 });
const msg = (t, erro) => { $('msg').textContent = t; $('msg').className = erro ? 'err' : 'mu'; };

function renderParams() {
  $('params').innerHTML = '';
  Object.keys(nomes).forEach((k) => {
    const l = document.createElement('label'); l.textContent = nomes[k];
    const i = document.createElement('input'); i.type = 'number'; i.step = '0.05'; i.value = params[k];
    i.onchange = () => { params[k] = +i.value; LS.set('hd_params', params); render(); };
    l.appendChild(i); $('params').appendChild(l);
  });
}

function calcular() {
  try {
    const r = H.estimar(entrada(), params), c = r.detalhe.contexto;
    const tags = [c.pico && 'pico', c.chuva && 'chuva', c.noite && 'noite', c.evento && 'evento'].filter(Boolean).join(', ') || 'normal';
    $('res').innerHTML = `<div class="preco">${brl(r.total)}</div><div class="faixa">Faixa provável: ${brl(r.faixa[0])} a ${brl(r.faixa[1])}</div>
      <div class="mu">Base calculada ${brl(r.detalhe.bruto)}${r.detalhe.usouMinima ? ' (aplicou mínima)' : ''} · surge ×${r.detalhe.surge} · contexto: ${tags} · minutos usados: ${r.detalhe.minutosUsados}</div>`;
  } catch (e) { $('res').innerHTML = `<span class="err">${e.message}</span>`; }
}

function renderObs() {
  let h = '<tr><th>Quando</th><th>km</th><th>min</th><th>Real</th><th>Estimado</th><th>Erro</th></tr>';
  obs.forEach((o) => { const e = H.estimar(o, params).total; h += `<tr><td>${o.dataHora.replace('T', ' ')}</td><td>${o.km}</td><td>${o.min}</td><td>${brl(o.preco)}</td><td>${brl(e)}</td><td>${(((e - o.preco) / o.preco) * 100).toFixed(1)}%</td></tr>`; });
  $('tab').innerHTML = obs.length ? h : '';
  const m = H.erro(obs, params);
  if (m !== null) msg(`Erro médio (MAPE): ${m}% em ${obs.length} cotações` + (m < 15 ? ' — bom para apresentar.' : ' — calibre ou ajuste os parâmetros.'));
}

function render() { calcular(); renderObs(); }

$('calc').onclick = calcular;
$('add').onclick = () => {
  const p = +$('preco').value; const e = entrada();
  if (!(p > 0)) return msg('Informe o preço real.', true);
  if (!(e.km > 0 && e.min > 0)) return msg('Informe km e minutos.', true);
  obs.push({ ...e, preco: p }); LS.set('hd_obs', obs); $('preco').value = ''; render();
};
$('cal').onclick = () => {
  try { const antes = H.erro(obs, params); params = H.calibrar(obs, params); LS.set('hd_params', params); renderParams(); render(); msg(`Calibrado. Erro ${antes}% → ${H.erro(obs, params)}% (parâmetros base, km e min ajustados).`); }
  catch (e) { msg(e.message, true); }
};
$('clr').onclick = () => { if (confirm('Apagar todas as cotações registradas?')) { obs = []; LS.set('hd_obs', obs); $('msg').textContent = ''; render(); } };
$('rst').onclick = () => { params = {...H.PARAMS_PADRAO}; LS.set('hd_params', params); renderParams(); render(); };

renderParams(); render();
</script>
</body>
</html>
