<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ef">
  <title>HubDri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topo">
    <a href="#/fila" class="marca">HubDri</a>
    <nav class="nav" aria-label="Seções">
      <a href="#/fila" data-nav="fila">Fila</a>
      <a href="#/saida" data-nav="saida">Saída WhatsApp</a>
    </nav>
    <div class="topo-direita">
    <div class="notif">
      <button class="sino" id="sino" aria-expanded="false" aria-controls="painel-notif" aria-label="Notificações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
      <div class="painel" id="painel-notif" hidden>
        <div class="painel-topo">
          <strong>Notificações</strong>
          <button class="link" id="ler-todas">Marcar todas como lidas</button>
        </div>
        <ul id="lista-notif"></ul>
      </div>
    </div>
    <div class="conta" id="conta" hidden>
      <button class="sino avatar" id="avatar" aria-expanded="false" aria-controls="painel-conta" aria-label="Minha conta"></button>
      <div class="painel painel-conta" id="painel-conta" hidden>
        <div class="conta-info">
          <strong id="conta-nome"></strong>
          <span class="muted" id="conta-email"></span>
          <span class="label" id="conta-papel"></span>
        </div>
        <form method="post" action="/sair"><button class="btn bloco">Sair</button></form>
      </div>
    </div>
    </div>
  </header>
  <div class="conexao" id="conexao" role="alert" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span>Sem conexão com o servidor. Tentando de novo…</span>
  </div>
  <main id="app">
    <div class="carregando-tela"><span class="spinner grande" aria-hidden="true"></span>Carregando o hub…</div>
  </main>
  <div class="avisos" id="avisos"></div>
  <dialog class="dialogo" id="dialogo" aria-labelledby="dialogo-titulo"></dialog>
  <script src="/app.js" type="module"></script>
</body>
</html>
